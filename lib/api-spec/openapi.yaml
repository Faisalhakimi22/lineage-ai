      properties:
        provenanceConfidence:
          type: [number, "null"]
        mutationConfidence:
          type: [number, "null"]
        originConfidence:
          type: [number, "null"]
        lineageCompleteness:
          type: number
          minimum: 0
          maximum: 1
      required:
