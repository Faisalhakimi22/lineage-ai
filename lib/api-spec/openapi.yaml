openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lineage
    description: Claim investigation and curated-record operations
  - name: account
    description: Authenticated user profile and analysis history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /lineages:
    get:
      operationId: listLineages
      tags: [lineage]
      summary: List investigation records
      description: >
        Returns the small, curated investigation library - explicitly not a
        view of the whole internet. Each record carries a dataset_provenance
        field stating whether its lineage is externally verified or is only an
        illustrative teaching scenario. Illustrative origins and mutation
        chains are not established evidence.
      responses:
        "200":
          description: List of investigation records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineageSummary"
  /lineages/{id}:
    get:
      operationId: getLineage
      tags: [lineage]
      summary: Get a single investigation record by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lineage detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lineage"
        "404":
          description: Lineage not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analyze:
    post:
      operationId: analyzeText
      tags: [lineage]
      summary: Trace pasted text back to a documented lineage
      description: >
        Extracts the underlying claim from messy input and attempts to connect it
        to a documented lineage. Never returns a truth verdict as the primary
        result - it returns a trace status describing how confidently the claim
        could be connected to recorded provenance. Authentication is optional;
        when a valid bearer token is supplied the result is saved to the caller's
        history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimTextInput"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analyze/image:
    post:
      operationId: analyzeImage
      tags: [lineage]
      summary: Trace a screenshot or image (via OCR) back to a documented lineage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageAnalysisInput"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResult"
        "400":
          description: Invalid or unreadable image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Image too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported image type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me:
    get:
      operationId: getCurrentUser
      tags: [account]
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /history:
    get:
      operationId: listAnalyses
      tags: [account]
      summary: List the authenticated user's previous analyses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Analysis history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /history/{id}:
    get:
      operationId: getAnalysis
      tags: [account]
      summary: Reopen a previous analysis
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAnalysis
      tags: [account]
      summary: Delete one of the authenticated user's analyses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        llm_available:
          type: boolean
        semantic_matching_available:
          type: boolean
        auth_configured:
          type: boolean
        history_configured:
          type: boolean
        live_search_available:
          type: boolean
      required:
        - status
        - llm_available
        - semantic_matching_available
        - auth_configured
        - history_configured
        - live_search_available
    ErrorCode:
      type: string
      description: Stable machine-readable error code
      enum:
        - VALIDATION_ERROR
        - EMPTY_INPUT
        - INPUT_TOO_LONG
        - OCR_EMPTY
        - OCR_FAILED
        - UNSUPPORTED_MEDIA_TYPE
        - FILE_TOO_LARGE
        - UNAUTHENTICATED
        - AUTH_NOT_CONFIGURED
        - FORBIDDEN
        - NOT_FOUND
        - HISTORY_NOT_CONFIGURED
        - RATE_LIMITED
        - INTERNAL_ERROR
    ErrorResponse:
      type: object
      description: >
        Structured API error. `code` is stable and safe to branch on; `message`
        is human-readable and safe to display to end users.
      properties:
        error:
          type: object
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              type: [string, "null"]
          required:
            - code
            - message
            - details
      required:
        - error
    DatasetProvenance:
      type: string
      description: >
        Where this lineage record itself comes from. `externally_verified` means
        the mutation chain is corroborated by named outside sources. `illustrative`
        means the record was constructed by the project team to demonstrate a
        realistic mutation pattern, and must never be presented as a documented
        real-world investigation.
      enum:
        - externally_verified
        - illustrative
    SourceType:
      type: string
      enum:
        - primary_document
        - official_statement
        - news_report
        - fact_check
        - research
        - media_forensics
        - reference_organisation
    SourceAvailability:
      type: string
      description: >
        Whether a usable link exists for this source. `organisation_only` means we
        can name the body that holds the evidence but are not linking a specific
        published item, and the UI must not imply a specific article exists.
      enum:
        - linked
        - organisation_only
        - unavailable
    Source:
      type: object
      description: A single piece of provenance backing part of a lineage
      properties:
        publisher:
          type: string
        url:
          type: [string, "null"]
        published_date:
          type: [string, "null"]
        source_type:
          $ref: "#/components/schemas/SourceType"
        availability:
          $ref: "#/components/schemas/SourceAvailability"
        is_primary:
          type: boolean
          description: True if this is the body directly involved in the event, rather than a report about it
        evidence_description:
          type: string
          description: What this source actually establishes - not a summary of the source itself
      required:
        - publisher
        - url
        - published_date
        - source_type
        - availability
        - is_primary
        - evidence_description
    MutationType:
      type: string
      description: The kind of change applied at a hop in the chain
      enum:
        - original_event
        - stripped_context
        - exaggeration
        - fabricated_cause
        - recycled_old_media
        - misattribution
        - edited_media
        - selective_evidence
        - false_caption
        - translation_distortion
        - out_of_date_information
        - false_quotation
        - context_shift
    MutationChainNode:
      type: object
      description: >
        One hop in how information changed between the original event and the
        version that reached the user. Every hop must be able to answer: what
        changed, what it said before, what it says now, and why that matters.
      properties:
        hop:
          type: number
        type:
          $ref: "#/components/schemas/MutationType"
        text:
          type: string
          description: Short summary of the state of the information at this hop
        what_changed:
          type: string
        previously:
          type: [string, "null"]
          description: What the earlier version conveyed. Null at the original event.
        now:
          type: string
          description: What this version conveys
        why_it_matters:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
      required:
        - hop
        - type
        - text
        - what_changed
        - previously
        - now
        - why_it_matters
        - sources
    ProvenanceRelationshipType:
      type: string
      description: >
        The evidence-supported relationship between two records. Temporal,
        topical, or same-claim relationships are descriptive only; they do not
        establish source-to-source transmission.
      enum:
        - temporal_order
        - same_claim
        - same_event
        - related_claim
        - derived_from
        - reposted_from
        - quoted_from
        - corrected_by
        - same_media
    CuratedLineageRelationship:
      type: object
      description: >
        An explicitly authored connection in a curated evidence graph. Array
        ordering never creates an implicit connection.
      properties:
        id:
          type: string
        from_node_id:
          type: string
        to_node_id:
          type: string
        relationship:
          $ref: "#/components/schemas/ProvenanceRelationshipType"
        status:
          $ref: "#/components/schemas/InvestigationStageStatus"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        mutation_type:
          oneOf:
            - $ref: "#/components/schemas/MutationType"
            - type: "null"
        reason:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
      required:
        - id
        - from_node_id
        - to_node_id
        - relationship
        - status
        - confidence
        - mutation_type
        - reason
        - sources
    SignalLevel:
      type: string
      enum:
        - low
        - medium
        - high
        - unknown
    SignalId:
      type: string
      enum:
        - evidence_quality
        - emotional_framing
        - missing_context
        - ai_generated_likelihood
        - manipulation_risk
    Signal:
      type: object
      description: >
        An investigation signal, not a truth score. A signal says what a reader
        should look into; it never asserts that a claim is true or false.
      properties:
        id:
          $ref: "#/components/schemas/SignalId"
        label:
          type: string
        level:
          $ref: "#/components/schemas/SignalLevel"
        score:
          type: [number, "null"]
          description: Optional 0-100 magnitude behind the level. Null when not assessed.
        explanation:
          type: string
          description: Why this signal reads the way it does, in concrete terms
        what_to_check:
          type: string
          description: The action a reader can take to investigate this signal themselves
      required:
        - id
        - label
        - level
        - score
        - explanation
        - what_to_check
    Origin:
      type: object
      description: >
        The origin account stored with a record. It is established provenance
        only when the parent record is externally_verified and carries specific
        supporting sources; for illustrative records it is a teaching scenario.
      properties:
        source:
          type: string
        date:
          type: [string, "null"]
        what_actually_happened:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
      required:
        - source
        - date
        - what_actually_happened
        - sources
    Verdict:
      type: string
      description: >
        Characterisation of the documented record. Deliberately secondary to the
        mutation chain - the product does not lead with this.
      enum: ["false", "misleading", "missing_context", "true"]
    Topic:
      type: string
      enum:
        ["climate_energy", "civic_lahore", "environment", "general", "health"]
    Region:
      type: string
      enum: ["global", "pakistan"]
    LineageSummary:
      type: object
      description: Lightweight verified-case or illustrative-record summary for list views
      properties:
        id:
          type: string
        canonical_claim:
          type: string
        verdict:
          $ref: "#/components/schemas/Verdict"
        topic:
          $ref: "#/components/schemas/Topic"
        region:
          $ref: "#/components/schemas/Region"
        dataset_provenance:
          $ref: "#/components/schemas/DatasetProvenance"
        origin_source:
          type: string
        origin_date:
          type: [string, "null"]
        hop_count:
          type: number
        media_literacy_lesson:
          type: string
      required:
        - id
        - canonical_claim
        - verdict
        - topic
        - region
        - dataset_provenance
        - origin_source
        - origin_date
        - hop_count
        - media_literacy_lesson
    Lineage:
      type: object
      description: >
        A curated investigation record containing an origin account, mutation
        sequence, and sources. dataset_provenance determines whether that
        lineage is externally verified or merely illustrative and not
        established evidence.
      properties:
        id:
          type: string
        canonical_claim:
          type: string
        aliases:
          type: array
          items:
            type: string
        verdict:
          $ref: "#/components/schemas/Verdict"
        topic:
          $ref: "#/components/schemas/Topic"
        region:
          $ref: "#/components/schemas/Region"
        dataset_provenance:
          $ref: "#/components/schemas/DatasetProvenance"
        origin:
          $ref: "#/components/schemas/Origin"
        mutation_chain:
          type: array
          items:
            $ref: "#/components/schemas/MutationChainNode"
        curated_relationships:
          type: array
          description: >
            Explicit evidence relationships between origin/hop nodes. An empty
            list means the curated record does not assert graph connectivity.
          items:
            $ref: "#/components/schemas/CuratedLineageRelationship"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        media_literacy_lesson:
          type: string
          description: The transferable lesson a reader can carry to the next claim they see
      required:
        - id
        - canonical_claim
        - aliases
        - verdict
        - topic
        - region
        - dataset_provenance
        - origin
        - mutation_chain
        - curated_relationships
        - signals
        - sources
        - media_literacy_lesson
    TraceStatus:
      type: string
      description: >
        How confidently the submitted claim could be connected to a documented
        lineage. This is a statement about our evidence, never about the truth of
        the claim. UNTRACED means "we could not establish a lineage", which is
        emphatically not "this is false".
      enum:
        - TRACED
        - PARTIALLY_TRACED
        - UNTRACED
    MatchingStrategy:
      type: string
      description: Which layer produced the final decision
      enum:
        - lexical
        - semantic
        - llm_adjudicated
        - none
    InputType:
      type: string
      enum:
        - text
        - image
    SelfCheckStep:
      type: object
      description: A concrete verification action the reader can perform themselves
      properties:
        id:
          type: string
        text:
          type: string
        rationale:
          type: string
          description: Why this particular step is worth doing for this particular claim
      required:
        - id
        - text
        - rationale
    MatchCandidate:
      type: object
      description: A lineage considered during matching, exposed so the user can see near-misses rather than only the winner
      properties:
        lineage_id:
          type: string
        canonical_claim:
          type: string
        confidence:
          type: number
      required:
        - lineage_id
        - canonical_claim
        - confidence
    LiveSearchStatus:
      type: string
      description: >
        Whether a live web search was run for this analysis. A completed search
        supplies leads to inspect; it is never an automated truth verdict.
      enum:
        - not_configured
        - searched
        - failed
    LiveSearchSource:
      type: object
      description: A current web-search result. Its snippet is supplied by the search provider and is not a verified finding by Lineage.
      properties:
        provider_result_id:
          type: [string, "null"]
          description: Stable provider result identifier when one was supplied.
        provider_score:
          type: [number, "null"]
          description: Search-provider relevance score, not a provenance or truth score.
        title:
          type: string
        url:
          type: string
        description:
          type: string
        domain:
          type: string
        publisher:
          type: [string, "null"]
        published_date:
          type: [string, "null"]
        discovered_by_queries:
          type: array
          items:
            type: string
      required:
        - provider_result_id
        - provider_score
        - title
        - url
        - description
        - domain
        - publisher
        - published_date
        - discovered_by_queries
    LiveSearch:
      type: object
      description: >
        Link-only live web retrieval for the extracted claim. It does not
        establish truth, provenance, or a mutation chain.
      properties:
        provider:
          type: string
          enum: ["Brave Search", "Tavily"]
        status:
          $ref: "#/components/schemas/LiveSearchStatus"
        query:
          type: [string, "null"]
          description: The exact claim wording sent to the search provider, or null when no search was run.
        queries:
          type: array
          description: Every search query used to discover the returned leads.
          items:
            type: string
        searched_at:
          type: [string, "null"]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/LiveSearchSource"
        note:
          type: [string, "null"]
      required:
        - provider
        - status
        - query
        - queries
        - searched_at
        - sources
        - note
    InvestigationStageStatus:
      type: string
      description: The evidence state of one runtime investigation stage.
      enum:
        - not_attempted
        - in_progress
        - established
        - candidate
        - insufficient_evidence
        - blocked
        - error
    InvestigationStageId:
      type: string
      enum:
        - claim_extracted
        - live_search
        - source_discovery
        - earliest_source
        - context_comparison
        - mutation_detection
        - origin_assessment
        - lineage
    InvestigationStage:
      type: object
      description: A backend-produced investigation outcome with the evidence that supports it.
      properties:
        id:
          $ref: "#/components/schemas/InvestigationStageId"
        status:
          $ref: "#/components/schemas/InvestigationStageStatus"
        evidenceIds:
          type: array
          items:
            type: string
        confidence:
          type: [number, "null"]
        reason:
          type: string
      required:
        - id
        - status
        - evidenceIds
        - confidence
        - reason
    AcquisitionStatus:
      type: string
      enum:
        - not_attempted
        - acquired
        - partial
        - failed
        - blocked
        - unsupported
    EvidenceDateType:
      type: string
      enum:
        - publication
        - modified
        - event
        - upload
        - crawl_index
        - referenced_historical
        - unknown
    EvidenceDateSource:
      type: string
      enum:
        - json_ld
        - opengraph
        - html_metadata
        - article_metadata
        - visible_text
        - provider
        - unknown
    EvidenceSourceType:
      type: string
      enum:
        - primary
        - official
        - academic
        - fact_check
        - news
        - social
        - reference
        - other
    EvidencePassage:
      type: object
      description: A bounded passage retained because it supports a claim, date, context, provenance, or metadata finding.
      properties:
        id:
          type: string
        sourceId:
          type: string
        text:
          type: string
        kind:
          type: string
          enum: [claim, context, date, provenance, metadata]
        relevance:
          type: number
      required:
        - id
        - sourceId
        - text
        - kind
        - relevance
    EvidenceSnapshot:
      type: object
      description: Public metadata and bounded relevant passages for one acquired source. Full acquired page text is never returned.
      properties:
        id:
          type: string
        providerResultId:
          type: [string, "null"]
        originalUrl:
          type: string
        finalUrl:
          type: [string, "null"]
        canonicalUrl:
          type: [string, "null"]
        title:
          type: string
        domain:
          type: string
        publisher:
          type: [string, "null"]
        author:
          type: [string, "null"]
        publishedAt:
          type: [string, "null"]
        modifiedAt:
          type: [string, "null"]
        dateType:
          $ref: "#/components/schemas/EvidenceDateType"
        dateConfidence:
          type: number
        dateEvidence:
          type: [string, "null"]
        dateSource:
          $ref: "#/components/schemas/EvidenceDateSource"
        dateEvidencePassageId:
          type: [string, "null"]
        relevantPassages:
          type: array
          items:
            $ref: "#/components/schemas/EvidencePassage"
        sourceType:
          $ref: "#/components/schemas/EvidenceSourceType"
        providerScore:
          type: [number, "null"]
          description: Provider ranking signal retained for diagnostics only.
        retrievalRelevance:
          type: [number, "null"]
        claimRelevance:
          type: [number, "null"]
          description: Relevance calculated from acquired content, never from provider rank alone.
        evidenceRelevance:
          type: [number, "null"]
          description: Strength of the bounded acquired passages supporting the claim version.
        acquisitionStatus:
          $ref: "#/components/schemas/AcquisitionStatus"
        acquisitionError:
          type: [string, "null"]
        extractionConfidence:
          type: number
        discoveredByQueries:
          type: array
          items:
            type: string
      required:
        - id
        - providerResultId
        - originalUrl
        - finalUrl
        - canonicalUrl
        - title
        - domain
        - publisher
        - author
        - publishedAt
        - modifiedAt
        - dateType
        - dateConfidence
        - dateEvidence
        - dateSource
        - dateEvidencePassageId
        - relevantPassages
        - sourceType
        - providerScore
        - retrievalRelevance
        - claimRelevance
        - evidenceRelevance
        - acquisitionStatus
        - acquisitionError
        - extractionConfidence
        - discoveredByQueries
    ClaimCertainty:
      type: string
      enum:
        - possibility
        - uncertain
        - probable
        - asserted
        - confirmed
        - unknown
    CorrectionVerdict:
      type: string
      enum: ["true", "false", misleading, mixed, unverified, not_applicable]
    SourceClaimVersion:
      type: object
      description: The claim form extracted from one acquired source, with explicit qualifiers and attribution.
      properties:
        id:
          type: string
        sourceId:
          type: string
        claim:
          type: string
        normalizedProposition:
          type: string
        narrator:
          type: [string, "null"]
        quotedSpeaker:
          type: [string, "null"]
        sourceStance:
          type: string
          enum: [asserts, reports, quotes, questions, corrects, rejects, neutral, unknown]
        correctionVerdict:
          $ref: "#/components/schemas/CorrectionVerdict"
        claimType:
          type: string
          enum: [claim, quotation, headline, caption, correction, fact_check_framing, unknown]
        evidencePassageId:
          type: string
        subject:
          type: [string, "null"]
