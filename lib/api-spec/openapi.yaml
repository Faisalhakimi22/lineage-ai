        id:
          type: string
        claim:
          type: string
        exactText:
          type: string
        normalizedProposition:
          type: string
        evidenceType:
          $ref: "#/components/schemas/SubmittedOccurrenceEvidenceType"
        sourceUrl:
          type: [string, "null"]
        sourceIdentifier:
          type: [string, "null"]
        timestamp:
          type: [string, "null"]
        sourceContext:
          type: [string, "null"]
        evidenceIds:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/LineageEdgeEvidence"
        sourceRelationship:
          oneOf:
            - $ref: "#/components/schemas/SubmittedOccurrenceSourceRelationship"
            - type: "null"
      required:
        - id
        - claim
        - exactText
        - normalizedProposition
        - evidenceType
        - sourceUrl
        - sourceIdentifier
        - timestamp
        - sourceContext
        - evidenceIds
        - confidence
        - evidence
        - sourceRelationship
    SubmittedOccurrenceSourceRelationship:
      type: object
      properties:
        fromSourceId:
          type: string
        relationship:
          $ref: "#/components/schemas/ProvenanceRelationshipType"
        status:
          $ref: "#/components/schemas/LineageEdgeStatus"
        confidence:
          type: number
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/LineageEdgeEvidence"
        reason:
          type: string
      required:
        - fromSourceId
        - relationship
        - status
        - confidence
        - evidence
        - reason
    AnalyzeResult:
      type: object
      description: >
        The outcome of attempting to trace a submitted claim. Deliberately
        separates what was found, what was not found, and what remains uncertain.
      properties:
        extracted_claim:
          type: string
        input_type:
          $ref: "#/components/schemas/InputType"
        trace_status:
          $ref: "#/components/schemas/TraceStatus"
        confidence:
          type: number
          description: Legacy alias for librarySimilarity. It is not a truth or provenance score.
        matching_strategy:
          $ref: "#/components/schemas/MatchingStrategy"
        lineage:
          oneOf:
            - $ref: "#/components/schemas/Lineage"
            - type: "null"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MatchCandidate"
        live_search:
          $ref: "#/components/schemas/LiveSearch"
        knownRecordMatch:
          $ref: "#/components/schemas/KnownRecordMatch"
        knownRecordStages:
          type: array
          description: Curated known-case evidence stages, kept separate from the live investigation stages.
          items:
            $ref: "#/components/schemas/InvestigationStage"
        knownRecordScores:
          $ref: "#/components/schemas/KnownRecordScores"
        liveInvestigation:
          type: boolean
          description: True when this response includes a runtime web-evidence investigation rather than only a curated-library lookup.
        evidenceSnapshots:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceSnapshot"
        sourceVersions:
          type: array
          items:
            $ref: "#/components/schemas/SourceClaimVersion"
        comparisons:
          type: array
          items:
            $ref: "#/components/schemas/SourceComparison"
        mutations:
          type: array
          items:
            $ref: "#/components/schemas/DetectedMutation"
        originAssessment:
          $ref: "#/components/schemas/OriginAssessment"
        dynamicLineage:
          $ref: "#/components/schemas/RuntimeLineageGraph"
        investigationStages:
          type: array
          items:
            $ref: "#/components/schemas/InvestigationStage"
        librarySimilarity:
          type: number
          description: Similarity between the submitted claim and the closest curated-library record; not a truth score.
        sourceRelevance:
          type: [number, "null"]
        provenanceConfidence:
          type: [number, "null"]
        mutationConfidence:
          type: [number, "null"]
        originConfidence:
          type: [number, "null"]
        lineageCompleteness:
          type: number
          description: Evidence-backed completeness of the runtime lineage, from 0 to 1.
        imageEvidence:
          oneOf:
            - $ref: "#/components/schemas/ImageEvidence"
            - type: "null"
        submittedOccurrence:
          oneOf:
            - $ref: "#/components/schemas/SubmittedOccurrence"
            - type: "null"
        what_we_found:
          type: array
          items:
            type: string
        what_we_did_not_find:
          type: array
          items:
            type: string
        uncertainty_notes:
          type: array
          items:
            type: string
        messenger_safe_explanation:
          type: [string, "null"]
        self_check_steps:
          type: array
          items:
            $ref: "#/components/schemas/SelfCheckStep"
        analysis_id:
          type: [string, "null"]
          description: Set when the result was saved to the caller's history
      required:
        - extracted_claim
        - input_type
        - trace_status
        - confidence
        - matching_strategy
        - lineage
        - candidates
        - live_search
        - knownRecordMatch
        - knownRecordStages
        - knownRecordScores
        - liveInvestigation
        - evidenceSnapshots
        - sourceVersions
        - comparisons
        - mutations
        - originAssessment
        - dynamicLineage
        - investigationStages
        - librarySimilarity
        - sourceRelevance
        - provenanceConfidence
        - mutationConfidence
        - originConfidence
        - lineageCompleteness
        - imageEvidence
        - submittedOccurrence
        - what_we_found
        - what_we_did_not_find
        - uncertainty_notes
        - messenger_safe_explanation
        - self_check_steps
        - analysis_id
    ClaimTextInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
        occurrence:
          $ref: "#/components/schemas/SubmittedOccurrenceInput"
