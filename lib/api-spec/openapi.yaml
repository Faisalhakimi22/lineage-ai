          maxLength: 300
        sourcePostId:
          type: [string, "null"]
          maxLength: 500
        observedAt:
          type: [string, "null"]
        exactQuote:
          type: [string, "null"]
          maxLength: 5000
        context:
          type: [string, "null"]
          maxLength: 5000
    ImageAnalysisInput:
      type: object
      properties:
        image:
          type: string
          format: binary
      required:
        - image
    UserProfile:
