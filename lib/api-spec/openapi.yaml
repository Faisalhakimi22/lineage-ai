        displayName:
          type: [string, "null"]
        photoURL:
          type: [string, "null"]
        createdAt:
          type: string
        lastLoginAt:
          type: string
      required:
        - userId
        - email
        - displayName
        - photoURL
        - createdAt
        - lastLoginAt
    AnalysisSummary:
      type: object
      description: Row in the user's history list
      properties:
        id:
          type: string
        inputType:
          $ref: "#/components/schemas/InputType"
        extractedClaim:
          type: string
        traceStatus:
          $ref: "#/components/schemas/TraceStatus"
        confidence:
          type: number
        matchedLineageId:
          type: [string, "null"]
        createdAt:
          type: string
      required:
        - id
        - inputType
        - extractedClaim
        - traceStatus
        - confidence
        - matchedLineageId
        - createdAt
    AnalysisRecord:
      type: object
      description: A stored analysis belonging to one user
      properties:
        id:
          type: string
        userId:
          type: string
        inputType:
          $ref: "#/components/schemas/InputType"
        originalInput:
          type: string
          description: For images this is the OCR-extracted text, never the image bytes
        result:
          $ref: "#/components/schemas/AnalyzeResult"
        createdAt:
          type: string
      required:
        - id
